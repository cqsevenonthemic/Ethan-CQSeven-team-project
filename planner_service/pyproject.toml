[project]
name = "maze-planner-service"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]
vision = ["numpy==2.2.3", "onnxruntime==1.20.1", "Pillow==11.1.0"]

[tool.pytest.ini_options]
testpaths = ["planner_service/tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["planner_service", "planner_service.planner", "planner_service.simulation", "planner_service.vision"]
package-dir = {planner_service = "."}

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

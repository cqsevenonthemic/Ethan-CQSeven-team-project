name: Planner service CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: Run the 100-maze batch benchmark
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: planner-service-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: planner_service/requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r planner_service/requirements-dev.lock

      - name: Install planner service
        run: python -m pip install --no-deps -e ./planner_service

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q planner_service

      - name: Run full pytest suite
        run: python -m pytest -c planner_service/pyproject.toml -q

  benchmark:
    name: 100-maze batch benchmark
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: planner_service/requirements-dev.lock

      - name: Install locked development dependencies
        run: python -m pip install -r planner_service/requirements-dev.lock

      - name: Install planner service
        run: python -m pip install --no-deps -e ./planner_service

      - name: Run 100-maze benchmark and replay validation
        run: |
          python -m planner_service.tests.sim_benchmark_100 \
            --count 100 \
            --start-seed 0 \
            --fault-every 3 \
            --output planner_service/artifacts/ci_seed_0_99
          python -m planner_service.simulation.replay planner_service/artifacts/ci_seed_0_99

      - name: Upload benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-service-benchmark
          path: planner_service/artifacts/ci_seed_0_99
          if-no-files-found: error
